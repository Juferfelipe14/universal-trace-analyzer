# Streamlit Community Cloud puts an app to sleep after 12 hours without
# visits; whoever arrives next sees a "wake up" screen. This opens the app
# every 6 hours (free for public repos) through ?ping=1, which the app
# answers without counting it as a visitor. If the app is already asleep,
# it presses the wake-up button.
name: Keep the analyzer awake
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - name: Open the app
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          URL = "https://trace-analyzer-signaltrace.streamlit.app/?ping=1"
          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(8000)
              wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if wake.count():
                  print("App was asleep - waking it up")
                  wake.first.click()
                  page.wait_for_timeout(60000)
              else:
                  print("App was awake")
              page.wait_for_timeout(15000)
              print("title:", page.title())
              b.close()
          PY
